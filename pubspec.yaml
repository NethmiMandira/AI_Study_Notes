name: ai_study_notes
description: "An AI-powered Study Notes Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # Firebase Services (Remote Database & Authentication)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.2

  # State Management & Local Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  flutter_dotenv: ^6.0.1

  # Networking
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - .env